<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIFT — discover the web</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a08;
    --surface: #111110;
    --border: #222220;
    --accent: #c8f060;
    --accent2: #ff6b35;
    --text: #e8e8e0;
    --muted: #555550;
    --card-bg: #141412;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: crosshair;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
  }

  header {
    padding: 32px 40px 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
    position: relative;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    letter-spacing: 6px;
    color: var(--accent);
    line-height: 1;
    text-shadow: 0 0 40px rgba(200,240,96,0.3);
  }

  .tagline {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .hn-badge {
    margin-left: auto;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    padding: 4px 10px;
    opacity: 0.7;
  }

  /* main stage */
  .stage {
    padding: 48px 40px 32px;
    min-height: calc(100vh - 200px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* card */
  .card {
    width: 100%;
    max-width: 760px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    padding: 40px 44px;
    position: relative;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent 60%);
  }

  .card-index {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .card-domain {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 20px;
  }

  .card-meta {
    display: flex;
    gap: 24px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .card-meta span { display: flex; align-items: center; gap: 6px; }

  .score-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
  }

  .card-url {
    font-size: 10px;
    color: var(--muted);
    word-break: break-all;
    font-style: italic;
    margin-bottom: 24px;
  }

  /* open button */
  .open-btn {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    padding: 12px 32px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }

  .open-btn:hover {
    background: #d8ff70;
    transform: translateY(-1px);
  }

  /* seen tracker */
  .seen-bar {
    margin-top: 20px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .seen-bar span { color: var(--accent); }

  /* drift button */
  .drift-zone {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .drift-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 8px;
    padding: 18px 60px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.2s;
  }

  .drift-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-101%);
    transition: transform 0.2s ease;
    z-index: 0;
  }

  .drift-btn:hover::before { transform: translateX(0); }
  .drift-btn:hover { color: var(--bg); }
  .drift-btn span { position: relative; z-index: 1; }

  .drift-hint {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* loading state */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 80px 0;
  }

  .loading-label {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .loader {
    width: 40px;
    height: 2px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .loader::after {
    content: '';
    position: absolute;
    left: -40px;
    width: 40px;
    height: 100%;
    background: var(--accent);
    animation: slide 1s linear infinite;
  }

  @keyframes slide {
    to { left: 100%; }
  }

  /* error */
  .error-state {
    text-align: center;
    padding: 60px 0;
  }

  .error-state p {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* history strip */
  .history-strip {
    padding: 0 40px 40px;
    max-width: 840px;
    margin: 0 auto;
    width: 100%;
  }

  .history-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .history-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(34,34,32,0.5);
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.5px;
    transition: color 0.15s;
    cursor: pointer;
  }

  .history-item:hover { color: var(--text); }

  .history-num {
    font-size: 8px;
    color: var(--border);
    letter-spacing: 1px;
    min-width: 20px;
  }

  .history-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-score {
    color: var(--accent);
    font-size: 9px;
    opacity: 0.6;
  }

  /* keyboard hint */
  .kbd-hint {
    position: fixed;
    bottom: 24px;
    right: 40px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0.5;
  }

  .kbd {
    border: 1px solid var(--border);
    padding: 2px 6px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
  }

  @media (max-width: 600px) {
    header { padding: 24px 20px 0; }
    .logo { font-size: 48px; }
    .stage { padding: 32px 20px 24px; }
    .card { padding: 28px 24px; }
    .card-title { font-size: 28px; }
    .history-strip { padding: 0 20px 32px; }
    .drift-btn { font-size: 22px; padding: 14px 40px; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">DRIFT</div>
    <div class="tagline">serendipitous discovery engine</div>
  </div>
  <div class="hn-badge">↑ HN live feed</div>
</header>

<div class="stage" id="stage">
  <div class="loading-state" id="loading">
    <div class="loader"></div>
    <div class="loading-label">pulling from hacker news</div>
  </div>

  <div id="card-wrap" style="width:100%;max-width:760px;display:none;flex-direction:column;align-items:center;">
    <div class="card" id="card">
      <div class="card-index" id="card-index">—</div>
      <div class="card-domain" id="card-domain">—</div>
      <div class="card-title" id="card-title">—</div>
      <div class="card-meta">
        <span><span class="score-dot"></span><span id="card-score">—</span> pts</span>
        <span>↑ <span id="card-comments">—</span> comments</span>
        <span>by <span id="card-by">—</span></span>
      </div>
      <div class="card-url" id="card-url">—</div>
      <a id="card-link" href="#" target="_blank" rel="noopener noreferrer" class="open-btn">OPEN LINK →</a>
    </div>
    <div class="seen-bar">
      seen <span id="seen-count">0</span> of <span id="pool-count">—</span> in today's pool
    </div>

    <div class="drift-zone">
      <button class="drift-btn" id="drift-btn"><span>DRIFT →</span></button>
      <div class="drift-hint">or press spacebar</div>
    </div>
  </div>

  <div class="error-state" id="error-state" style="display:none;">
    <p>fetch failed</p>
    <p style="color:var(--muted);font-size:10px;">HN API unreachable — check connection</p>
  </div>
</div>

<div class="history-strip" id="history-strip" style="display:none;">
  <div class="history-label">session trail</div>
  <div class="history-list" id="history-list"></div>
</div>

<div class="kbd-hint"><span class="kbd">space</span> to drift</div>

<script>
const HN_API = 'https://hacker-news.firebaseio.com/v0';
const CACHE_KEY = 'drift_pool';
const CACHE_TS_KEY = 'drift_pool_ts';
const SEEN_KEY = 'drift_seen';
const HISTORY_KEY = 'drift_history';
const CACHE_TTL = 60 * 60 * 1000; // 1 hour

let pool = [];
let seen = new Set();
let history = [];
let currentStory = null;

// --- DOM refs ---
const loadingEl = document.getElementById('loading');
const cardWrap = document.getElementById('card-wrap');
const cardEl = document.getElementById('card');
const errorEl = document.getElementById('error-state');
const driftBtn = document.getElementById('drift-btn');
const historyStrip = document.getElementById('history-strip');
const historyList = document.getElementById('history-list');

function getDomain(url) {
  try {
    return new URL(url).hostname.replace('www.', '');
  } catch { return '—'; }
}

async function fetchPool() {
  // Check cache
  const cached = localStorage.getItem(CACHE_KEY);
  const cachedTs = localStorage.getItem(CACHE_TS_KEY);
  if (cached && cachedTs && Date.now() - parseInt(cachedTs) < CACHE_TTL) {
    return JSON.parse(cached);
  }

  // Fetch top 500 IDs
  const idsRes = await fetch(`${HN_API}/topstories.json`);
  const ids = await idsRes.json();
  const top = ids.slice(0, 100); // top 100

  // Fetch stories in batches of 10
  const stories = [];
  for (let i = 0; i < top.length; i += 10) {
    const batch = top.slice(i, i + 10);
    const results = await Promise.all(
      batch.map(id => fetch(`${HN_API}/item/${id}.json`).then(r => r.json()))
    );
    results.forEach(s => {
      if (s && s.url && s.title && s.score > 10) {
        stories.push({
          id: s.id,
          title: s.title,
          url: s.url,
          score: s.score,
          comments: s.descendants || 0,
          by: s.by,
          domain: getDomain(s.url)
        });
      }
    });
  }

  localStorage.setItem(CACHE_KEY, JSON.stringify(stories));
  localStorage.setItem(CACHE_TS_KEY, String(Date.now()));
  return stories;
}

function loadSeen() {
  try {
    const raw = localStorage.getItem(SEEN_KEY);
    if (raw) seen = new Set(JSON.parse(raw));
  } catch { seen = new Set(); }
}

function saveSeen() {
  localStorage.setItem(SEEN_KEY, JSON.stringify([...seen]));
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) history = JSON.parse(raw);
  } catch { history = []; }
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 30)));
}

function pickStory() {
  // Prefer unseen
  const unseen = pool.filter(s => !seen.has(s.id));
  const candidates = unseen.length > 0 ? unseen : pool;
  if (unseen.length === 0) seen.clear(); // reset when exhausted

  // Weighted by score
  const total = candidates.reduce((acc, s) => acc + Math.sqrt(s.score), 0);
  let rand = Math.random() * total;
  for (const s of candidates) {
    rand -= Math.sqrt(s.score);
    if (rand <= 0) return s;
  }
  return candidates[0];
}

function showStory(story) {
  currentStory = story;
  seen.add(story.id);
  saveSeen();

  // Update card
  const idx = pool.findIndex(s => s.id === story.id) + 1;
  document.getElementById('card-index').textContent = `#${idx} of today's top ${pool.length}`;
  document.getElementById('card-domain').textContent = story.domain;
  document.getElementById('card-title').textContent = story.title;
  document.getElementById('card-score').textContent = story.score.toLocaleString();
  document.getElementById('card-comments').textContent = story.comments.toLocaleString();
  document.getElementById('card-by').textContent = story.by;
  document.getElementById('card-url').textContent = story.url;
  document.getElementById('card-link').href = story.url;
  document.getElementById('seen-count').textContent = seen.size;
  document.getElementById('pool-count').textContent = pool.length;

  // Animate
  cardEl.classList.remove('visible');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => cardEl.classList.add('visible'));
  });

  // Add to history
  history.unshift(story);
  saveHistory();
  renderHistory();
}

function renderHistory() {
  if (history.length < 2) return;
  historyStrip.style.display = 'block';
  historyList.innerHTML = '';
  history.slice(1, 8).forEach((s, i) => {
    const item = document.createElement('a');
    item.className = 'history-item';
    item.href = s.url;
    item.target = '_blank';
    item.rel = 'noopener noreferrer';
    item.innerHTML = `
      <span class="history-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="history-title">${s.title}</span>
      <span class="history-score">${s.score}↑</span>
    `;
    historyList.appendChild(item);
  });
}

function drift() {
  if (pool.length === 0) return;
  const story = pickStory();
  showStory(story);
}

async function init() {
  loadSeen();
  loadHistory();

  try {
    pool = await fetchPool();
    if (pool.length === 0) throw new Error('empty pool');

    loadingEl.style.display = 'none';
    cardWrap.style.display = 'flex';

    drift();
  } catch (e) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    console.error(e);
  }
}

driftBtn.addEventListener('click', drift);

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    drift();
  }
});

init();
</script>
</body>
</html>
